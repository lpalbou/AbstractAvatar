[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractavatar"
version = "0.1.1"
description = "Shared procedural avatar generation for native, terminal and web platforms"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Laurent-Philippe Albou"}]
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/lpalbou/AbstractAvatar"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
abstractavatar = ["_native/*.dylib", "_native/*.so", "_native/*.dll"]
